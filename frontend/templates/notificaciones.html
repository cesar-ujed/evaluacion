{% extends "layouts/main.html" %}
{% load static %}
{% block content %}

<style>
      body {
        background-image: url("{% static 'images/bg_3.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        margin: 0;
    }

    /* Overlay oscuro para mejorar legibilidad */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.4);
        z-index: -1;
    }
</style>

<div class="container mt-4">
  <h4>
    <a class="bi bi-arrow-left-circle text-white me-2" href="{% url 'inicio' %}"></a> 
    🔔 Notificaciones
  </h4>
  <br>

  {% for n in notificaciones %}
    <div class="alert alert-info d-flex justify-content-between align-items-center {% if n.leida %}opacity-50{% endif %}">
      <div>
        {{ n.mensaje }}
        <br>
        <small class="text-muted">{{ n.fecha|date:"d/m/Y H:i" }}</small>
      </div>
      <form action="{% url 'eliminar_notificacion' n.id %}" method="post" style="margin:0;">
        {% csrf_token %}
        <button type="submit" class="btn-close" aria-label="Close"></button>
      </form>
    </div>
  {% empty %}
    <p>No tienes notificaciones nuevas.</p>
  {% endfor %}
</div>


{% include 'layouts/footer.html' %}

{% endblock %}
